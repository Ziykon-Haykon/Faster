<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Document</title>
    <style>
        .IWannaLog {
            margin-top: 1rem;
            margin-left: 24.3%;
        }
         .IWannaReg {
            margin-top: 1rem;
            margin-left: 20%;
         }
    </style>
</head>
<body>
    <div class="auth">

        <div class="register" id="register" >

            <form id="formRegister" action="/register" method="post" class="form_input_name">
                <h1>Hello everynyan</h1>
                <h4>Input your name</h4>
                <input id="name" type="text" name="name" placeholder="Input the name">
                <h4>Input your email</h4>
                <input id="email" type="text" name="email" placeholder="Input the email">
                <h4>Input your password</h4>
                <input id="password" type="password" name="password" placeholder="Input the password">
                <h4>Input your age</h4>
                <input id="age" type="number" name="age" placeholder="Input the age">
                <button type="submit">Register</button>
            </form>

            <button class="IWannaLog" onclick="showLogin()">I wanna Login</button>
        </div>
        <div class="hidden" id="login" >

            <form id="formLogin" action="/login" method="post" class="form_input_name">
                <h1>Welcome back</h1>
                <h4>Input your email</h4>
                <input id="name" type="email" name="email" placeholder="Input the email">
                <h4>Input your password</h4>
                <input id="password" type="password" name="password" placeholder="Input the password">
                <button type="submit">Login</button>
            </form>
            <button class="IWannaReg" onclick="showRegister()">I wanna register</button>

        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
