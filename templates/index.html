<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Document</title>
    <style>
    .auth {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .auth .hidden {
        display: none;
    }
    .auth button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #2772bc;
        color: white;
        cursor: pointer;
    }
    .auth .IWannaLog {
        margin-top: 1rem;
        margin-left: 24.3%;
    }
    .auth .IWannaReg {
        margin-top: 1rem;
        margin-left: 20%;
    }
    </style>
</head>
<body>
    <div class="auth">

        {% if message %}
        <div class="alert">{{ message }}</div>
        {% endif %}

        <div id="register" class="register {% if show == 'login' or show == 'none' %}hidden{% endif %}">

            <form id="formRegister" class="form_input_name" method="post" action="/register">
                <h1>Hello everynyan</h1>
                <h4>Input your name</h4>
                <input id="name" type="text" name="name" placeholder="Input the name">
                <h4>Input your email</h4>
                <input id="email" type="text" name="email" placeholder="Input the email">
                <h4>Input your password</h4>
                <input id="password" type="password" name="password" placeholder="Input the password">
                <h4>Input your age</h4>
                <input id="age" type="number" name="age" placeholder="Input the age">
                <button type="submit">Register</button>
            </form>

            <button type="button" class="IWannaLog">I wanna Login</button>
        </div>
        <div id="login" class="{% if show != 'login' %}hidden{% endif %}">
            <form id="formLogin" class="form_input_name" method="post" action="/login">
                <h1>Welcome back</h1>
                <h4>Input your email</h4>
                <input id="emailLogin" type="email" name="email" placeholder="Input the email">
                <h4>Input your password</h4>
                <input id="passwordLogin" type="password" name="password" placeholder="Input the password">
                <button type="submit">Login</button>
            </form>
            <button type="button" class="IWannaReg">I wanna register</button>

        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
